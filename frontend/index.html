<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TenderMate – IT Pre-Sales Assistant</title>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fa;margin:0;color:#172033}
header{background:#172033;color:white;padding:22px 28px} h1{margin:0;font-size:24px}
main{max-width:1100px;margin:25px auto;padding:0 18px}
.upload{background:white;border:2px dashed #9aa8bd;border-radius:12px;padding:35px;text-align:center}
button{background:#172033;color:white;border:0;border-radius:7px;padding:11px 18px;cursor:pointer}
#status{margin:15px 0;color:#586579}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:20px}
.card{background:white;border-radius:10px;padding:15px;border:1px solid #e1e6ed}
.label{font-size:12px;color:#68758a;text-transform:uppercase}.value{font-size:16px;margin-top:6px}
.page{font-size:11px;color:#68758a}.confidence{float:right}
pre{white-space:pre-wrap;background:white;padding:15px;border-radius:10px;max-height:450px;overflow:auto}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><h1>TenderMate – IT Pre-Sales Assistant</h1></header>
<main>
<div class="upload">
<input id="pdf" type="file" accept=".pdf">
<button onclick="analyze()">Analyze Tender</button>
<div id="status">Upload one tender PDF. Digital and scanned PDFs are supported.</div>
</div>
<section id="result"></section>
</main>
<script>
const labels={tender_title:"Tender Title",reference_number:"Reference Number",closing_date:"Closing Date",closing_time:"Closing Time",pre_bid_date:"Pre-Bid Date",pre_bid_time:"Pre-Bid Time",pre_bid_location:"Pre-Bid Location",submission_location:"Submission Location",delivery_period:"Delivery Period",bid_validity:"Bid Validity",quantity:"Tender Quantity",warranty:"Warranty",bid_security:"Bid Security",performance_security:"Performance Security",required_documents:"Required Documents"};
async function analyze(){
 const input=document.getElementById("pdf"), status=document.getElementById("status");
 if(!input.files[0]){status.textContent="Select a PDF first.";return}
 const fd=new FormData(); fd.append("file",input.files[0]); status.textContent="Reading pages and running OCR where required...";
 try{
  const res=await fetch("/api/analyze",{method:"POST",body:fd}); const data=await res.json();
  if(!res.ok) throw new Error(data.detail||"Analysis failed");
  let html='<h2>'+escape(data.filename)+' — '+data.page_count+' pages</h2><div class="grid">';
  for(const [key,label] of Object.entries(labels)){const f=data.summary[key]||{};html+=`<div class="card"><div class="label">${label}<span class="confidence">${f.confidence?Math.round(f.confidence*100)+"%":""}</span></div><div class="value">${escape(f.value||"Not found")}</div><div class="page">${f.page?"Source: Page "+f.page:""}</div></div>`}
  html+='</div><h2>OCR / Extracted Pages</h2><pre>'+escape(data.pages.map(p=>'--- Page '+p.page+' ['+p.method+'] ---\n'+p.text).join('\n\n'))+'</pre>';
  document.getElementById("result").innerHTML=html; status.textContent="Analysis complete.";
 }catch(e){status.textContent=e.message}
}
function escape(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
</script>
</body>
</html>
